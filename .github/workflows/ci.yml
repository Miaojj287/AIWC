name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format · typecheck · lint · dead code · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Typecheck (renderer + main + tests)
        run: npm run typecheck

      - name: Lint (boundaries, hooks, type-aware rules)
        run: npm run lint

      - name: Dead code
        run: npm run knip

      - name: Unit tests
        run: npm test
